services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    restart: always
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
      POSTGRES_DB: saas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: saas_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: saas_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/raw-media-bucket --ignore-existing;
      /usr/bin/mc mb myminio/processed-media-bucket --ignore-existing;
      /usr/bin/mc anonymous set download myminio/processed-media-bucket;
      exit 0;
      "
  
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: saas_api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://saas_user:saas_password@postgres:5432/saas_db
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      RAW_MEDIA_BUCKET: raw-media-bucket
      PROCESSED_MEDIA_BUCKET: processed-media-bucket
      JWT_SECRET: supersecret_production_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
  
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: saas_worker
    environment:
      DATABASE_URL: postgresql://saas_user:saas_password@postgres:5432/saas_db
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    
volumes:
  pgdata:
  miniodata: